[project]
name = "wxcc"
version = "0.1.0"
description = "CONUS weather-model comparison: degree days, forecast verification, extreme events"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "requests>=2.31",
    "numcodecs>=0.13",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wxcc = "wxcc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wxcc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
