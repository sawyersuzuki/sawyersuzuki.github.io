name: Data update

# Runs twice a day, a few hours after the 00Z and 12Z model runs are published.
# About 5 minutes per run, well inside the free allowance for a private repository.
on:
  schedule:
    - cron: "17 10 * * *"
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      backfill_start:
        description: "Optional: also backfill 00Z runs from this date (YYYY-MM-DD), regenerating their maps"
        required: false
        default: ""
      backfill_end:
        description: "Optional: last date of that backfill (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Restore recent maps from Releases
        run: wxcc fields pull || true
      - name: Optional backfill (manual runs only)
        if: ${{ inputs.backfill_start != '' && inputs.backfill_end != '' }}
        env:
          START: ${{ inputs.backfill_start }}
          END: ${{ inputs.backfill_end }}
        run: |
          wxcc backfill --model all --start "$START" --end "$END" --cycles 0 --refresh --yes
          wxcc backfill --model era5 --start "$START" --end "$END" --refresh --yes
          wxcc fields publish --all || true
      - name: Fetch latest runs, truth and market data
        run: wxcc update
      - name: Build dashboard
        run: wxcc build
      - name: Publish maps to Releases
        run: wxcc fields publish || true
      - name: Commit data
        run: |
          git config user.name "wxcc-bot"
          git config user.email "wxcc-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -q -m "Data update $(date -u +%Y-%m-%dT%HZ)"
            git pull -q --rebase
            git push -q
          fi
      - name: Keep the built dashboard for download
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: site/index.html
          retention-days: 3

  # Publishes the dashboard to GitHub Pages. Off until you opt in, so the job never fails by surprise:
  #   1. the repository must be public (Pages is not available for private repos on the Free plan)
  #   2. Settings > Pages > Source: GitHub Actions
  #   3. Settings > Secrets and variables > Actions > Variables: add DEPLOY_PAGES = true
  pages:
    if: ${{ vars.DEPLOY_PAGES == 'true' }}
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
