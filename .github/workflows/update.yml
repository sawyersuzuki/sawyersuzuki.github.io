name: Data update

# Runs twice a day, a few hours after the 00Z and 12Z model runs are published.
# About 5 minutes per run, well inside the free allowance for a private repository.
on:
  schedule:
    - cron: "17 10 * * *"
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Restore recent maps from Releases
        run: wxcc fields pull || true
      - name: Fetch latest runs, truth and market data
        run: wxcc update
      - name: Build dashboard
        run: wxcc build
      - name: Publish maps to Releases
        run: wxcc fields publish || true
      - name: Commit data
        run: |
          git config user.name "wxcc-bot"
          git config user.email "wxcc-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -q -m "Data update $(date -u +%Y-%m-%dT%HZ)"
            git pull -q --rebase
            git push -q
          fi
      - name: Keep the built dashboard for download
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: site/index.html
          retention-days: 3

  # Publishes the dashboard to GitHub Pages once the repository is public.
  # (Pages is not available for private repositories on the Free plan.)
  # To enable: make the repo public, then Settings > Pages > Source: GitHub Actions.
  pages:
    if: ${{ !github.event.repository.private }}
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
