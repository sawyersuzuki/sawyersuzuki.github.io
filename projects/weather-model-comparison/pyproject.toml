[project]
name = "wxcc"
version = "0.1.0"
description = "Weather Model Comparison: CONUS weather models compared by degree days, verification and extreme events"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "requests>=2.31",
    "numcodecs>=0.13",
    "typer>=0.12",
    "eccodes>=2.38",
    "h5py>=3.10",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.11"]
lab = ["scipy>=1.11", "xarray>=2024.1", "zarr>=2.18"]

[project.scripts]
wxcc = "wxcc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wxcc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
